<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{page_title}}</title>
<meta name="description" content="{{t:site.description}}">
<meta name="theme-color" content="#0f3d2e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/lexend-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
{{head}}<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="{{page}}">
<!-- Generated by scripts/build_pages.py from site_src/. Edit those files, then run the script. -->
<a class="skip-link" href="#main">{{t:site.skip}}</a>
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="index.html" aria-label="{{t:site.home_link}}">{{icon:drop}}<span>{{t:site.name}}</span></a>
    <nav class="top-nav" aria-label="{{t:site.nav_label}}">
      <ul>
{{nav}}
      </ul>
    </nav>
  </div>
</header>
<main id="main" tabindex="-1">
<p class="offline-note wrap" id="offline-note" role="status" hidden></p>
{{body}}
</main>
<footer class="site-footer">
  <div class="wrap footer-inner">
    <p class="footer-brand">{{icon:drop}}<span>{{t:site.name}}</span></p>
    <p>{{t:footer.credit}}</p>
    <p>{{t:footer.images}}</p>
    <p class="footer-small">{{t:footer.map_data}} {{t:footer.boundaries}}</p>
  </div>
</footer>
<nav class="bottom-nav" aria-label="{{t:site.nav_label}}">
  <ul>
{{bottom_nav}}
  </ul>
</nav>
<script src="js/common.js"></script>
{{scripts}}</body>
</html>
